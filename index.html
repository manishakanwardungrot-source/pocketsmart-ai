<!DOCTYPE html>
<html>
<head>
    <title>PocketSmart AI</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7ff;
            margin: 0;
            padding: 0;
        }

        header {
            background: #4f46e5;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .container {
            max-width: 600px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px #ccc;
        }

        input, button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            box-sizing: border-box;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        button {
            background: #4f46e5;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #3730a3;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            background: #eef2ff;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<header>
    <h1>💰 PocketSmart AI</h1>
    <p>Smart Budget & Expense Manager</p>
</header>

<div class="container">

    <h2>Monthly Budget</h2>

    <input type="number" id="income" placeholder="Enter your monthly income">

    <input type="number" id="expense" placeholder="Enter your monthly expenses">

    <button onclick="calculateBudget()">Calculate Budget</button>

    <div class="result" id="result">
        Your result will appear here.
    </div>

    <h2>Expense Tracker</h2>

    <input type="text" id="expenseName" placeholder="Expense name">

    <input type="number" id="expenseAmount" placeholder="Expense amount">

    <button onclick="addExpense()">Add Expense</button>

    <div id="expenseList"></div>

</div>

<script>

function calculateBudget() {

    let income = Number(document.getElementById("income").value);
    let expense = Number(document.getElementById("expense").value);

    let balance = income - expense;

    document.getElementById("result").innerHTML =
        "<b>Monthly Income:</b> ₹" + income +
        "<br><b>Monthly Expenses:</b> ₹" + expense +
        "<br><b>Remaining Balance:</b> ₹" + balance;

}

function addExpense() {

    let name = document.getElementById("expenseName").value;
    let amount = document.getElementById("expenseAmount").value;

    if (name === "" || amount === "") {
        alert("Please enter expense details.");
        return;
    }

    let list = document.getElementById("expenseList");

    list.innerHTML +=
        "<p>📝 " + name + " - ₹" + amount + "</p>";

    document.getElementById("expenseName").value = "";
    document.getElementById("expenseAmount").value = "";
}

</script>

</body>
</html>
